name: Release (npm)

# Manual only. A release is a decision, not a side effect of a merge.
#
# The default is a rehearsal. `dry_run` is true unless it is deliberately
# turned off, so a dispatch builds, tests and packs the tarball and then stops
# short of the registry. The publish job is a separate job so that the `npm`
# environment is only entered by a run that actually publishes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: false
        default: 'latest'
      dry_run:
        description: 'Build, test and pack without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build @kingdom-community/github-docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      # Never publish something that was not just proven to build and pass.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Prints the exact file list that a publish would upload.
      - name: Pack
        run: npm pack --dry-run
      - name: Report (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: nothing was published."
          echo "The tarball contents listed above are what would have gone to"
          echo "npm under dist-tag '${{ inputs.tag }}'."

  publish:
    name: Publish @kingdom-community/github-docs
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write  # npm provenance
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public --tag "${{ inputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
